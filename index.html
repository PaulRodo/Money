<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f4f4f5);--tx:var(--tg-theme-text-color,#18181b);--hint:var(--tg-theme-hint-color,#80808a);--btn:var(--tg-theme-button-color,#27272a);--btnt:var(--tg-theme-button-text-color,#fff);--ln:rgba(128,128,138,.28);--inc:#2f7d5b;--exp:#b4443f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"SF Pro Text",Roboto,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
body{max-width:560px;margin:0 auto;padding:6px 16px calc(120px + env(safe-area-inset-bottom,0px))}
h2{font-size:12px;font-weight:600;color:var(--hint);letter-spacing:.04em;margin:26px 0 8px}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:2px 0 0}
.sub,small{color:var(--hint);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.tbl>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln)}
.tbl>div:last-child{border:0}.tbl b{font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.two b{display:block;font-size:19px;font-weight:600}
.bar{height:4px;background:var(--bg2);margin-top:6px}.bar i{display:block;height:100%;background:var(--tx)}.bar i.w{background:#b9822d}.bar i.x{background:var(--exp)}
.env{padding:12px 0;border-bottom:1px solid var(--ln)}
.env .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.env input{width:96px;text-align:right;padding:6px 8px;font-size:14px}
.tx{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.tx small{display:block}.tx .a{text-align:right;font-weight:600;white-space:nowrap}
.day{margin:16px 0 2px}
.empty{color:var(--hint);padding:18px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--hint);font:inherit;font-size:12px;padding:14px 0 12px;border-top:2px solid transparent;margin-top:-1px}
nav button.on{color:var(--tx);font-weight:600;border-top-color:var(--tx)}
#fab{position:fixed;right:16px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border:0;border-radius:8px;background:var(--btn);color:var(--btnt);font-size:26px;line-height:1;z-index:6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:10}.sheet.open{display:flex}
.sheet .in{background:var(--bg);width:100%;max-width:560px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:12px 12px 0 0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:none;color:var(--tx);font:inherit;padding:9px}.seg button.on{background:var(--btn);color:var(--btnt)}
input{width:100%;font:inherit;color:var(--tx);background:var(--bg2);border:1px solid transparent;border-radius:8px;padding:11px 12px;outline:0}input:focus{border-color:var(--ln)}
input.amount{font-size:28px;font-weight:600;text-align:right}
label{display:block;font-size:12px;color:var(--hint);margin:14px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips button{border:1px solid var(--ln);background:none;color:var(--tx);font:inherit;font-size:13px;padding:6px 11px;border-radius:6px}.chips button.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.btn{width:100%;border:0;background:var(--btn);color:var(--btnt);font:inherit;font-weight:600;padding:13px;border-radius:8px;margin-top:10px}
.btn.g{background:none;color:var(--tx);border:1px solid var(--ln);font-weight:400}.btn.d{color:var(--exp)}
.view{display:none}.view.on{display:block}
svg{width:100%;height:auto;display:block}svg text{fill:var(--hint);font-size:10px}
.leg{display:flex;gap:14px;margin-top:6px}.leg i{display:inline-block;width:8px;height:8px;margin-right:5px}

:root{--acc:#5a5cf0;--acc2:#8b4ff0}
@keyframes vin{from{opacity:0;transform:translate(var(--dx,0px),12px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes pop2{from{transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes fadeout{to{opacity:0;transform:translateY(-10px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@keyframes blink{50%{opacity:.5}}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(90,92,240,.5),0 8px 18px rgba(90,92,240,.4)}70%,100%{box-shadow:0 0 0 16px rgba(90,92,240,0),0 8px 18px rgba(90,92,240,.4)}}
.view.anim>*{animation:vin .5s cubic-bezier(.2,.7,.2,1) both}
.bar{height:6px;border-radius:6px;overflow:hidden}
.bar i{border-radius:6px;transform-origin:left;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.bar i.w{background:#d99a2b}.bar i.x{background:var(--exp);animation:grow .9s cubic-bezier(.2,.7,.2,1) both,blink 1.6s .9s ease-in-out infinite}
svg rect{transform-box:fill-box;transform-origin:50% 100%;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.two>div{padding:12px 14px;border-radius:12px}
.two>div:first-child{background:rgba(47,125,91,.13)}.two>div:last-child{background:rgba(180,68,63,.13)}
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:12px;box-shadow:0 6px 16px rgba(90,92,240,.35);transition:transform .15s}
.btn:not(.g)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
.btn.g{background:var(--bg2);color:var(--tx);box-shadow:none;border-color:transparent}
.btn.g.d{color:var(--exp)}
.btn:active,#fab:active,.chips button:active,.seg button:active,nav button:active{transform:scale(.94)}
#fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:30px;animation:pulse 2.4s infinite;transition:transform .15s}
.chips button{background:var(--bg2);border-color:transparent;padding:8px 13px;border-radius:20px;transition:transform .15s,background .2s}
.chips button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;transform:scale(1.06)}
.seg{border-radius:12px;padding:3px;background:var(--bg2);border-color:transparent}
.seg button{border-radius:10px;transition:background .25s,color .25s}
.seg button.on{color:#fff}.seg button[data-ty=exp].on{background:var(--exp)}.seg button[data-ty=inc].on{background:var(--inc)}
nav button{transition:color .2s,transform .15s}nav button.on{color:var(--acc);border-top-color:var(--acc)}
.tx:active,.env:active{background:var(--bg2)}
.sheet.open{animation:fade .2s}.sheet.open .in{animation:up .35s cubic-bezier(.2,.8,.2,1)}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(160deg,#1b1a4b,#3f3bd0 55%,#8b4ff0);color:#fff;text-align:center;transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash svg{width:140px;margin:0 auto 18px}
#splash polyline{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:240;stroke-dashoffset:240;animation:dash 1.1s .2s cubic-bezier(.4,0,.2,1) forwards}
#splash circle{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:pop2 .4s 1.1s forwards}
#splash h1{margin:0;font-size:30px;font-weight:600;animation:vin .7s .5s both}
#splash p{margin:6px 0 0;opacity:.75;animation:vin .7s .8s both}
.flash{position:fixed;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none}
.flash>div{background:var(--bg);border-radius:20px;padding:22px 32px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.28);animation:pop .35s cubic-bezier(.2,1.4,.4,1) both,fadeout .3s .85s forwards}
.flash svg{width:64px;height:64px;margin:0 auto 8px}
.flash circle,.flash path{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:180;stroke-dashoffset:180;animation:dash .5s .1s forwards}
.flash path{stroke-dasharray:40;stroke-dashoffset:40;animation-duration:.35s;animation-delay:.5s}
@media (prefers-reduced-motion:reduce){*,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

.sec{background:var(--bg2);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:0 0 14px}
.sec h2{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:var(--tx);letter-spacing:0;margin:0 0 12px}
.sec h2::before,.acc-h::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.sec .bar{background:rgba(128,128,138,.22)}
.sec input{background:var(--bg)}
.sec .btn.g{background:var(--bg)}
.sec .tx:active,.sec .env:active{background:rgba(128,128,138,.15)}
.acc{padding:0;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--tx);font:inherit;font-size:15px;font-weight:700;padding:16px;text-align:left}
.acc-h:active{background:rgba(128,128,138,.12)}
.acc-h span{flex:1}.acc-h small{font-weight:400}
.chev{width:9px;height:9px;border-right:2px solid var(--hint);border-bottom:2px solid var(--hint);transform:rotate(45deg);transition:transform .35s;margin:-3px 4px 0 0}
.acc.open .chev{transform:rotate(225deg);margin-top:3px}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.7,.2,1)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-i{overflow:hidden;min-height:0;padding:0 16px;opacity:0;visibility:hidden;transition:opacity .3s,padding .4s,visibility 0s .4s}
.acc.open .acc-i{opacity:1;visibility:visible;padding:0 16px 16px;transition-delay:0s}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw button{border:0;background:none;color:var(--hint);font:inherit;font-size:11px;padding:0}
.sw i{display:block;height:40px;border-radius:12px;border:2px solid var(--ln);margin-bottom:4px;transition:transform .2s,box-shadow .2s}
.sw button.on{color:var(--tx)}.sw button.on i{border-color:var(--acc);transform:scale(1.06);box-shadow:0 0 0 2px var(--acc)}
body{transition:background .4s}

.seg{grid-template-columns:repeat(3,1fr)}.seg button[data-ty=tr].on{background:var(--acc)}
select{width:100%;font:inherit;color:var(--tx);background:var(--bg2);border:0;border-radius:8px;padding:11px 12px;outline:0}
.sheet .in{max-height:92vh;overflow:auto}.sheet input,.sheet select{margin-top:8px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lnk{border:0;background:none;color:var(--acc);font:inherit;padding:8px 0}
input[type=checkbox]{width:auto;margin:0}.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px;margin:8px 0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:60;animation:vin .3s both}
.toast button{border:0;background:none;color:#a5a7ff;font:inherit;font-weight:600}
.pk{margin:14px 0 12px}.sec>input{margin-top:8px}.sec>.btn{margin-top:12px}
svg rect.nr{animation:none}.ln{animation:fade .6s both}
.rtw{display:flex;justify-content:flex-end;margin:10px 0}
.rtb{border:1px solid var(--ln);background:var(--bg2);color:var(--tx);font:inherit;font-size:13px;padding:7px 12px;border-radius:20px;display:flex;align-items:center;gap:8px}
.rtb .chev{margin:-3px 0 0}.rtb.open .chev{transform:rotate(225deg);margin-top:3px}
.rtp:not(.open){margin:0;border-width:0}

body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 8% 0%,color-mix(in srgb,var(--acc) 24%,transparent),transparent),radial-gradient(50% 35% at 100% 25%,color-mix(in srgb,var(--acc2) 18%,transparent),transparent)}
.sec{background:color-mix(in srgb,var(--bg2) 72%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
@keyframes slr{from{opacity:0;transform:translateX(40px)}}@keyframes sll{from{opacity:0;transform:translateX(-40px)}}
@keyframes dr{from{stroke-dasharray:0 251.3}}@keyframes shm{to{background-position:-200% 0}}
.pk3{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;margin:14px 0 12px}
.pn{border:0;border-radius:8px;background:var(--bg2);color:var(--tx);font:inherit;font-size:22px;transition:transform .15s}.pn:active{transform:scale(.9)}
.tx{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer;position:relative}
.pdr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.pdr small{display:block}.pdr .a{text-align:right;font-weight:600}
.dg{display:inline-block;height:1em;line-height:1;overflow:hidden;vertical-align:top}.dg i{display:block;font-style:normal;line-height:1;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.dn{width:120px;height:120px;margin:12px auto 0;display:block}.dn circle{animation:dr 1s cubic-bezier(.2,.7,.2,1) both}
.sp{width:56px;height:16px;display:inline-block;vertical-align:middle;margin-right:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.sk{height:18px;margin:12px 0;border-radius:6px;background:linear-gradient(90deg,var(--ln),rgba(128,128,138,.08),var(--ln));background-size:200% 100%;animation:shm 1.2s linear infinite}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.hm small{text-align:center}.hm span{display:block}
.hm button{border:0;border-radius:8px;aspect-ratio:1;color:var(--tx);font:inherit;font-size:12px;padding:0;transition:transform .15s}.hm button:active{transform:scale(.9)}
.fbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}.fbar i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}

#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px}#lock.on{display:grid}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--hint)}.dots i.on{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}.pad button{height:60px;border:0;border-radius:16px;background:var(--bg2);color:var(--tx);font:inherit;font-size:22px}.pad button:active{transform:scale(.92)}
body.cov .view{filter:blur(16px)}
.pal{display:flex;flex-wrap:wrap;gap:8px}.pal button{width:34px;height:34px;border-radius:10px;border:2px solid transparent;padding:0;background:var(--bg2);color:var(--tx)}.pal svg{width:18px;height:18px;margin:auto}
.ci{display:inline-flex;width:22px;height:22px;border-radius:7px;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle;color:#fff}.ci svg{width:14px;height:14px}
</style>
</head>
<body>
<div id="splash"><div><svg viewBox="0 0 120 60"><polyline points="6,50 32,34 52,42 78,16 98,26 114,8"/><circle cx="114" cy="8" r="5"/></svg><h1>Финансы</h1><p>Доходы. Расходы. Контроль.</p></div></div>
<div id="v-home" class="view on"></div><div id="v-inc" class="view"></div><div id="v-exp" class="view"></div><div id="v-an" class="view"></div><div id="v-set" class="view"></div>
<button id="fab" aria-label="Добавить операцию">+</button>
<nav>
<button data-t="home" class="on">Обзор</button><button data-t="inc">Доходы</button><button data-t="exp">Расходы</button><button data-t="an">Аналитика</button><button data-t="set">Ещё</button>
</nav>
<div id="lock"><div><b id="lt" style="font-size:17px"></b><div class="dots" id="ld"></div><div class="pad" id="lp"></div><button class="lnk" id="lb" style="display:none;margin-top:14px">Войти по биометрии</button><button class="lnk" id="lc" style="display:none;margin-top:14px">Отмена</button></div></div>
<div class="sheet" id="fsheet"><div class="in"><b id="ft"></b><div id="ff"></div><button class="btn" id="fs">Сохранить</button><button class="btn g d" id="fd">Удалить</button><button class="btn g" id="fcn">Отмена</button></div></div>
<div class="sheet" id="csheet"><div class="in"><b id="ct"></b><input id="cn" maxlength="30" placeholder="Название"><label>Цвет</label><div class="pal" id="cpal"></div><label>Значок</label><div class="pal" id="cico"></div><button class="btn" id="cs">Сохранить</button><button class="btn g d" id="cd">Удалить</button><button class="btn g" id="cc">Отмена</button></div></div>
<div class="sheet" id="sheet"><div class="in">
<div class="seg"><button data-ty="exp" class="on">Расход</button><button data-ty="inc">Доход</button><button data-ty="tr">Перевод</button></div>
<input class="amount" id="amt" inputmode="decimal" placeholder="0" autocomplete="off">
<div class="r2" id="fx"><input id="cur" maxlength="4" placeholder="Валюта"><input id="rate" inputmode="decimal"></div>
<div class="chips" id="chips"></div>
<div id="splits"></div><button class="lnk" id="addsplit">Разбить на категории</button>
<div class="r2"><select id="acc"></select><select id="acc2"></select></div>
<input type="date" id="date">
<div class="r2" id="bizw"><label class="chk"><input type="checkbox" id="biz"> Облагается налогом</label><input id="trate" inputmode="decimal" placeholder="Ставка, %"></div>
<input id="note" placeholder="Заметка" maxlength="60">
<button class="btn" id="save">Сохранить</button><button class="btn g d" id="del">Удалить</button><button class="btn g" id="cancel">Отмена</button>
</div></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const hap=k=>{try{tg.HapticFeedback.notificationOccurred(k)}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS={exp:['Еда','Кафе','Транспорт','Обязательные','Налоги','Развлечения','Покупки','Здоровье','Другое'],inc:['YouTube','Boosty','Реклама','Донаты','Подработка','Прочее']};
const DC0=JSON.parse(JSON.stringify(CATS));
const DEF={tx:[],env:{},upd:0,set:{cur:'₽',income:0,mand:0,hide:false,bg:'tg',acc:'def',splash:'logo',tax:{on:false,rate:6}}};
let S=JSON.parse(JSON.stringify(DEF));
function norm(d){d.set=Object.assign({},DEF.set,d.set);d.env=d.env||{};d.tx=d.tx||[];d.tx.forEach(t=>{if(t.cat==='Жильё')t.cat='Обязательные'});d.xc=d.xc||[];d.pend=d.pend||[];if(!d.cats)d.cats={exp:[...DC0.exp,...d.xc.filter(c=>!DC0.exp.includes(c))],inc:[...DC0.inc]};d.cm=d.cm||{};d.rec=d.rec||[];d.goals=d.goals||[];CATS.exp.splice(0,CATS.exp.length,...d.cats.exp);CATS.inc.splice(0,CATS.inc.length,...d.cats.inc);if(!d.acc||!d.acc.length)d.acc=[{id:1,name:'Основной',open:0}];d.tx.forEach(t=>{if(!t.acc)t.acc=d.acc[0].id});return d}
try{const r=JSON.parse(localStorage.getItem('wallet_v2')||localStorage.getItem('wallet_v1'));if(r)S=norm(r)}catch(e){}S=norm(S);
/* Telegram CloudStorage: данные режутся на куски по 3500 символов */
let cT;const cloud=tg&&tg.CloudStorage;
function cloudSave(){if(!cloud)return;clearTimeout(cT);cT=setTimeout(()=>{const s=JSON.stringify(S),n=Math.ceil(s.length/3500);cloud.setItem('w_n',String(n));for(let i=0;i<n;i++)cloud.setItem('w_'+i,s.slice(i*3500,(i+1)*3500))},900)}
function cloudLoad(){if(!cloud)return;cloud.getItem('w_n',(e,v)=>{const n=+v;if(e||!n)return cloudSave();const k=[...Array(n).keys()].map(i=>'w_'+i);cloud.getItems(k,(e2,r)=>{if(e2)return;try{const d=JSON.parse(k.map(x=>r[x]).join(''));if(d.upd>S.upd){S=norm(d);localStorage.setItem('wallet_v2',JSON.stringify(S));applyBg();applyAcc();renderAll()}else if(d.upd<S.upd)cloudSave()}catch(x){}})})}
const save=()=>{S.upd=Date.now();if(typeof nsSchedule==='function')nsSchedule();try{localStorage.setItem('wallet_v2',JSON.stringify(S))}catch(e){}cloudSave()};
const fmt=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:0});
const money=n=>fmt(n)+'\u00A0'+S.set.cur;
const MK=t=>{const d=new Date(t);return d.getFullYear()*12+d.getMonth()};
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+t.amount,0);
const mon=o=>{const k=MK(Date.now())-o,t=S.tx.filter(x=>MK(x.ts)===k);return{t,inc:sum(t,'inc'),exp:sum(t,'exp'),d:new Date(Math.floor(k/12),k%12,1)}};
const byCat=t=>{const r={};t.filter(x=>x.type==='exp').forEach(x=>r[x.cat]=(r[x.cat]||0)+x.amount);return r};
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const row=(a,b)=>`<div><span>${a}</span><b>${b}</b></div>`;

function free(m){const lim=Object.values(S.env).reduce((s,v)=>s+v,0),pool=S.set.income-S.set.mand-lim,c=byCat(m.t);
 const spent=Object.entries(c).filter(([k])=>k!=='Обязательные'&&k!=='Налоги'&&!S.env[k]).reduce((s,[,v])=>s+v,0);return{lim,pool,spent,left:pool-spent}}

 else{const p=f.pool>0?Math.min(100,f.spent/f.pool*100):100;

 const L=[1,2,3].map(mon).filter(x=>x.inc>0||x.exp>0),avgI=L.length?L.reduce((s,x)=>s+x.inc,0)/L.length:0,minI=L.length?Math.min(...L.map(x=>x.inc)):0,avgE=L.length?L.reduce((s,x)=>s+x.exp,0)/L.length:0;

 const cm=byCat(m.t),cp=byCat(p.t),keys=[...new Set([...Object.keys(cm),...Object.keys(cp)])].sort((a,b)=>(cm[b]||0)-(cm[a]||0));

 <h2>Прогноз на месяц</h2><div class="tbl">${row('Расходы на сегодня',money(m.exp))}${row('Прогноз до конца месяца',money(proj))}${row('Прошлый месяц',money(p.exp))}${row('Ожидается к получению',money(S.pend.filter(x=>(x.t||'inc')==='inc').reduce((s,x)=>s+x.amount,0)))}${row('Запланированные расходы',money(S.pend.filter(x=>x.t==='exp').reduce((s,x)=>s+x.amount,0)))}${row('Отличие прогноза',p.exp?((proj>=p.exp?'+':'')+pct(proj-p.exp,p.exp)+'%'):'нет данных')}</div>
 <h2>Сравнение с прошлым месяцем</h2>`;

 h+=`<h2>Нерегулярный доход</h2>`+(L.length?`<div class="tbl">${row('Средний доход за '+L.length+' мес.',money(avgI))}${row('Минимальный доход',money(minI))}${row('Безопасный уровень трат',money(Math.max(0,minI-S.set.mand)))}</div><div class="sub">Безопасный уровень: минимальный доход за период минус обязательные платежи.</div>`:'<div class="empty">Нужны данные хотя бы за один прошлый месяц.</div>')+
 `<h2>Подушка безопасности</h2>`+(avgE>0?`<div class="big">${cu.toFixed(1).replace('.',',')} мес.</div><div class="sub">при среднем расходе ${money(avgE)} в месяц</div>`:'<div class="empty">Появится после первого полного месяца.</div>');
 h+=extraAn()+taxHtml();$('v-an').innerHTML=h;document.querySelectorAll('#v-an rect').forEach((r,i)=>r.style.animationDelay=i*70+'ms');sections($('v-an'));chartInit();anExtra()}

function recNext(r,ts){const d=new Date(ts);if(r.every==='week')d.setDate(d.getDate()+7);else if(r.every==='year')d.setFullYear(d.getFullYear()+1);else{d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(r.day||1,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}return d.getTime()}
function runRec(){const now=Date.now();let ch=0;S.rec.forEach(r=>{let i=0;while(r.next<=now&&i++<120){const t={id:Date.now()+ch++,type:r.t,acc:S.acc[0].id,cat:r.cat,amount:r.amount,note:r.note||'Регулярный платёж',ts:r.next};if(r.t==='inc'&&S.set.tax.on){t.biz=true;t.tp=S.set.tax.rate}S.tx.push(t);r.next=recNext(r,r.next)}});if(ch)save()}
function recHtml(ty){const L=S.rec.filter(r=>r.t===ty),inc=ty==='inc';
 return `<section class="sec"><h2>${inc?'Регулярные доходы':'Регулярные платежи и подписки'}</h2>${L.length?L.map(r=>`<div class="pdr"><div>${esc(r.note||r.cat)}<small>${esc(r.cat)} · ${RP[r.every]} · дальше ${new Date(r.next).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})}</small></div><div class="a">${money(r.amount)}<small><button class="lnk" data-rd="${r.id}">Удалить</button></small></div></div>`).join(''):'<div class="sub">Пока нет. Операции будут создаваться сами в нужный день.</div>'}
 <div class="r2" style="margin-top:12px"><select id="rcat-${ty}">${CATS[ty].map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="ramt-${ty}" inputmode="decimal" placeholder="Сумма"></div><div class="r2"><select id="rev-${ty}"><option value="month">Каждый месяц</option><option value="week">Каждую неделю</option><option value="year">Каждый год</option></select><input type="date" id="rdt-${ty}" value="${dstr(Date.now())}"></div><input id="rnt-${ty}" placeholder="Название (например, подписка)" maxlength="60"><button class="btn g" id="radd-${ty}">Добавить регулярный</button></section>`}
function recInit(ty,el){el.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{S.rec=S.rec.filter(r=>String(r.id)!==b.dataset.rd);save();renderAll()});
 $('radd-'+ty).onclick=()=>{const a=num($('ramt-'+ty).value);if(!(a>0)){hap('error');$('ramt-'+ty).focus();return}const d=new Date(($('rdt-'+ty).value||dstr(Date.now()))+'T12:00:00');
  S.rec.push({id:Date.now(),t:ty,cat:$('rcat-'+ty).value,amount:r2(a),note:$('rnt-'+ty).value.trim(),every:$('rev-'+ty).value,day:d.getDate(),next:d.getTime()});runRec();save();renderAll();hap('success')}}
function sched(ty,k){const out=[];if(k<MK(Date.now()))return out;S.pend.filter(x=>(x.t||'inc')===ty&&MK(x.due)===k).forEach(x=>out.push({cat:x.cat,amount:x.amount,ts:x.due,note:x.note,p:1}));
 S.rec.filter(r=>r.t===ty).forEach(r=>{let n=r.next,i=0;while(MK(n)<=k&&i++<400){if(MK(n)===k)out.push({cat:r.cat,amount:r.amount,ts:n,note:r.note||'Регулярный платёж'});n=recNext(r,n)}});return out}
function schedHtml(ty,k,tot){const L=sched(ty,k).sort((a,b)=>a.ts-b.ts);if(!L.length)return'';const s=L.reduce((a,x)=>a+x.amount,0);
 return `<section class="sec"><h2>Запланировано на месяц</h2>${L.map(x=>`<div class="pdr"><div>${esc(x.note||x.cat)}<small>${esc(x.cat)} · ${new Date(x.ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}${x.p?'':' · регулярный'}</small></div><div class="a">${money(x.amount)}</div></div>`).join('')}<div class="tbl" style="margin-top:8px">${row('Запланировано',money(s))}${row('Уже в учёте',money(tot))}${row('Итого за месяц',money(tot+s))}</div></section>`}

function editGoal(g){dlg(g?'Цель':'Новая цель',[{k:'n',l:'Название',v:g&&g.name},{k:'t',l:'Сумма цели',v:g&&g.target,n:1},{k:'d',l:'Срок',v:g&&g.date||'',t:'date'},{k:'m',l:'Сколько откладывать в месяц (необязательно)',v:g&&g.monthly||'',n:1}],o=>{const t=num(o.t);if(!o.n.trim()||!(t>0))return false;
 const v={name:o.n.trim(),target:t,date:o.d,monthly:num(o.m)};if(g)Object.assign(g,v);else S.goals.push(Object.assign({id:Date.now(),saved:0},v));save();renderAll()})}
function goals(){const el=$('a-goal');if(!el)return;const now=new Date();
 el.innerHTML=(S.goals.length?S.goals.map(g=>{const p=Math.min(100,g.saved/g.target*100),rem=Math.max(0,g.target-g.saved);let info='';
  if(rem<=0)info='Цель достигнута';else{if(g.date){const dt=new Date(g.date+'T12:00:00'),m=Math.max(1,Math.ceil((dt-now)/2.63e9));info='Нужно откладывать '+money(rem/m)+' в месяц до '+dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
   if(g.monthly>0){const d=new Date(now.getFullYear(),now.getMonth()+Math.ceil(rem/g.monthly),1);info+=(info?'. ':'')+'При '+money(g.monthly)+' в месяц цель будет достигнута в '+d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}}

 const gf=b=>S.goals.find(x=>String(x.id)===b);
 el.querySelectorAll('[data-gp]').forEach(b=>b.onclick=()=>{const g=gf(b.dataset.gp);dlg('Пополнить цель',[{k:'a',l:'Сумма (отрицательная уменьшит накопленное)',n:1}],o=>{const a=num(o.a);if(!a)return false;g.saved=Math.max(0,r2(g.saved+a));save();renderAll();hap('success')})});
 el.querySelectorAll('[data-ge]').forEach(b=>b.onclick=()=>editGoal(gf(b.dataset.ge)));
 el.querySelectorAll('[data-gd]').forEach(b=>b.onclick=()=>ask('Удалить цель?',()=>{S.goals=S.goals.filter(x=>String(x.id)!==b.dataset.gd);save();renderAll()}));

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('w1:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');

function lockShow(mode,title){LK={mode,buf:'',first:''};$('lt').textContent=title;ldraw();$('lock').classList.add('on');$('lb').style.display=mode==='check'&&S.set.bio&&BM&&BM.isAccessGranted?'':'none';$('lc').style.display=mode==='check'?'none':''}

$('lb').onclick=bioTry;$('lc').onclick=()=>$('lock').classList.remove('on');

 if(LK.mode==='check'){if(await sha(v)===S.set.pinh){$('lock').classList.remove('on');ldraw();afterUnlock()}else{hap('error');$('lt').textContent='Неверный PIN, попробуйте ещё раз';ldraw()}}
 else if(LK.mode==='new'){LK.first=v;LK.mode='confirm';$('lt').textContent='Повторите PIN';ldraw()}
 else{if(v===LK.first){S.set.pinh=await sha(v);save();$('lock').classList.remove('on');renderAll();hap('success')}else{LK.mode='new';$('lt').textContent='PIN не совпал. Введите новый PIN';ldraw()}}};

function buildPlan(){const n=NT(),now=Date.now(),amt=n.amt,days={},dc={},D=x=>dstr(x);
 S.tx.filter(x=>x.ts>now-15*864e5&&x.ts<=now+864e5&&x.type!=='tr').forEach(x=>{const d=D(x.ts),o=days[d]=days[d]||{i:0,e:0,n:0};o.n++;if(x.type==='inc')o.i+=x.amount;else{o.e+=x.amount;const c=dc[d]=dc[d]||{};c[x.cat]=(c[x.cat]||0)+x.amount}});
 let mx=1;Object.values(days).forEach(o=>mx=Math.max(mx,o.i,o.e));const sc=amt?1:mx/1000,q=v=>Math.round(v/sc);
 Object.values(days).forEach(o=>{o.i=q(o.i);o.e=q(o.e)});Object.values(dc).forEach(c=>{for(const k in c)c[k]=q(c[k])});
 const items=[];S.pend.forEach(x=>items.push({d:D(x.due),t:x.t||'inc',n:x.note||x.cat,a:amt?x.amount:null}));
 S.rec.forEach(r=>{let t=r.next,i=0;while(t<now+35*864e5&&i++<60){items.push({d:D(t),t:r.t,n:r.note||r.cat,a:amt?r.amount:null,r:1});t=recNext(r,t)}});
 const by=byCat(mon(0).t),env=Object.entries(S.env).map(([c,l])=>({c,p:Math.round((by[c]||0)/l*100)})),nw=new Date(),dd=[];
 if(S.set.tax.on)for(let i=0;i<3;i++)dd.push(D(new Date(nw.getFullYear(),nw.getMonth()+(nw.getDate()>28?1:0)+i,28,12).getTime()));
 return {v:1,tz:-nw.getTimezoneOffset(),amt,cur:S.set.cur,bal:amt?r2(totalBal()):null,s:{rem:n.rem,remH:n.remH,tax:n.tax,env:n.env,week:n.week,wd:n.wd,wh:n.wh,eve:n.eve,eh:n.eh,rc:n.rc,ra:n.ra,rb:n.rb},items,days,dc,env,tax:S.set.tax.on?{d:dd}:null}}

 if(!/^#[0-9a-f]{6}$/i.test(b)){['--bg','--bg2','--tx','--hint','--ln'].forEach(v=>r.removeProperty(v));try{tg.setHeaderColor('bg_color');tg.setBackgroundColor('secondary_bg_color')}catch(e){}return}
 const c=hx(b),dk=(.299*c[0]+.587*c[1]+.114*c[2])/255<.5;
 r.setProperty('--bg',b);r.setProperty('--bg2',mix(c,dk?[255,255,255]:[0,0,0],dk?.07:.05));r.setProperty('--tx',dk?'#f2f3f5':'#18181b');r.setProperty('--hint',dk?'#9a9eab':'#6f7280');r.setProperty('--ln',dk?'rgba(255,255,255,.14)':'rgba(0,0,0,.12)');
 try{tg.setHeaderColor(b);tg.setBackgroundColor(b)}catch(e){}}
function swHtml(){return`<div class="sw" id="sw-bg">`+BGS.map(([k,n])=>`<button data-bg="${k}" class="${S.set.bg===k?'on':''}"><i style="background:${k==='tg'?'conic-gradient(#fff 0 50%,#2b2d33 0)':k}"></i>${n}</button>`).join('')+`</div><label>Свой цвет фона</label><input type="color" id="s-bg" value="${/^#[0-9a-f]{6}$/i.test(S.set.bg)?S.set.bg:'#ffffff'}" style="height:46px;padding:4px">`}
function acHtml(){return`<div class="sw" id="sw-ac">`+ACS.map(([k,n])=>`<button data-ac="${k}" class="${(S.set.acc||'def')===k?'on':''}"><i style="background:${k==='def'?'#5a5cf0':k}"></i>${n}</button>`).join('')+'</div>'}
function splHtml(){return`<select id="s-spl">${[['logo','Логотип'],['bal','Баланс'],['month','Итоги месяца'],['none','Без заставки']].map(([k,n])=>`<option value="${k}"${(S.set.splash||'logo')===k?' selected':''}>${n}</option>`).join('')}</select>`}
function applyAcc(){const r=document.documentElement.style,k=S.set.acc||'def',h=k==='def'?'#5a5cf0':k;r.setProperty('--acc',h);r.setProperty('--acc2',k==='def'?'#8b4ff0':mix(hx(h),[0,0,0],.28))}
function wave(e,fn){if(!document.startViewTransition){fn();return}const x=e.clientX,y=e.clientY,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 document.startViewTransition(fn).ready.then(()=>document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:650,easing:'ease-out',pseudoElement:'::view-transition-new(root)'})).catch(()=>{})}
function swInit(){const bs=document.querySelectorAll('#sw-bg button'),as=document.querySelectorAll('#sw-ac button');
 bs.forEach(b=>b.onclick=e=>wave(e,()=>{S.set.bg=b.dataset.bg;save();applyBg();bs.forEach(x=>x.classList.toggle('on',x===b))}));
 as.forEach(b=>b.onclick=e=>wave(e,()=>{S.set.acc=b.dataset.ac;save();applyAcc();as.forEach(x=>x.classList.toggle('on',x===b))}));
 $('s-bg').oninput=e=>{S.set.bg=e.target.value;save();applyBg();bs.forEach(x=>x.classList.remove('on'))};
 catsInit();secInit();ntInit()}
applyBg();applyAcc();rtPrep();rtFetch();try{tg.disableVerticalSwipes()}catch(e){}runRec();renderAll();cloudLoad();try{BM.init()}catch(e){}if(S.set.pinh){lockShow('check','Введите PIN');bioTry()}else afterUnlock();
</script>
